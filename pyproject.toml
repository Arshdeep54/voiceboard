[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceboard"
version = "1.1.0"
description = "Use your phone as a private voice/text input device for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Arshdeep Singh", email = "hey@hiesenbug.dev"}]
dependencies = ["qrcode>=8,<9"]

[project.scripts]
voiceboard = "voice_receiver.server:main"

[tool.setuptools.packages.find]
include = ["voice_receiver*"]

[tool.setuptools.package-data]
voice_receiver = ["static/*.css", "static/*.js", "static/fonts/*"]
